# Example competition file. Copy to competition.toml (ignored by git) and
# adjust, or pass another path with --competition / COMPETITION.
#
# The database is the source of the competition; this file is only an import:
# - It is applied only when the database has no competition yet. Later edits
#   to this file change nothing; the server warns that the file differs.
# - --replace-competition / REPLACE_COMPETITION replaces the competition,
#   categories, heats, finals, timeplan and jury categories with this file.
#   Club data (clubs, riders, acts with music, judges, bookings, …) is kept;
#   timeplan slots and progress, finals placements and the jury plan are
#   dropped. Judge registrations are matched to the new jury categories by
#   name; the others are written to data_path/remap/ to fill in. A file that
#   changes nothing replaces nothing.
# - The logo, break image, sponsors and colors are the exception (ADR 0009,
#   ADR 0010): a replace keeps them unless the file sets logo_svg/logo_url,
#   break_image_svg/break_image_url, sponsors, primary_color or
#   secondary_color; "" resets one (sponsors = [] removes all sponsors).
# - The competition's id never changes once created.
#
# The photo password below ends up in the database; share a file with it only
# in trusted channels.

[competition]
id = "einradevent-demo-2027"
name = "Einradevent Demo 2027"
location = "SSV Nümbrecht"
# Example dates: replace them with the real ones. They are checked when the
# file is applied: registration and the music upload must end before
# start_date. Winter dates need the +01:00 offset, summer dates +02:00.
start_date = 2027-06-05
end_date = 2027-06-05
# All ages, and with them the categories, are counted against this day.
determining_day = 2027-06-01
registration_start = 2026-12-01T00:00:00+01:00
registration_end = 2027-04-30T23:59:59+02:00
music_upload_end = 2027-05-15T23:59:59+02:00
# Fee per start in €. Each single, pair and group start counts once.
fee_per_start = 15
# Maximum fee per rider in €, so only the first three starts are charged.
max_fee_per_rider = 45
# Optional, shown to clubs on their page.
venue = "Sporthalle Musterstadt, Musterstraße 1, 12345 Musterstadt"
contact_email = "info@example.org"
announcement_url = "https://example.org/ausschreibung/"
# Optional: where the info board's photo QR code leads, e.g. a share link.
photos_url = "https://fotos.example.org"
# Optional: the logo on every page and as favicon, as SVG (no
# scripts, event attributes like onload, <foreignObject> or links to other
# files). PNG, JPEG and WebP logos are uploaded in the admin UI. Left out, a
# replace keeps the current logo; "" resets it to the one built into the
# server.
# logo_svg = '''
# <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
#   <circle cx="50" cy="50" r="45" fill="#002d56"/>
# </svg>
# '''
# Optional instead of logo_svg: a URL the server downloads the logo from at
# startup and with "Bilder aktualisieren" in the admin UI. It serves its local
# copy and keeps the last good one if a download fails.
# logo_url = "https://example.org/logo.svg"
# Optional: the image the info board shows while no act runs, as break_image_svg
# or break_image_url like the logo. Without one, the logo applies.
# break_image_url = "https://example.org/pause.svg"
# Optional: the primary and secondary color of every page, e.g. from the
# logo, as "#rrggbb" or "#rgb". All other colors are derived from them, light,
# dark and for the info board; texts stay readable whatever the colors. Left
# out, a replace keeps the current color; "" resets it to the default built
# into the server (the blue and green below).
# primary_color = "#002d56"
# secondary_color = "#009036"

# Optional: the sponsors in the info board's footer, in order; none, no
# footer. The image is an inline svg or a url, like the logo; without either,
# a sponsor of the same name in the database keeps its (uploaded) image.
# [[competition.sponsors]]
# name = "Beispiel GmbH"
# link = "https://example.org"
# url = "https://example.org/sponsor.svg"

[competition.payment]
# Optional: leave it out until the deadline is decided.
deadline = 2027-05-15
# Must match the account holder exactly: banks compare the payee name on
# every transfer (Verification of Payee) and warn payers about a mismatch.
account_holder = "Demo Kassenwart"
iban = "DE02 1203 0000 0000 2020 51"
bic = "BYLADEM1001"
# The club name and its code are appended, e.g.
# "Startgeld: SSV Nümbrecht (EV-K7Q3)". The QR code adds "QR" at the end.
reference = "Startgeld"

# Optional: the clubs' jury obligation, used by the jury registration. The
# values are the defaults of the Jury-Konzept Einrad Freestyle.
[competition.jury]
# min_age = 15                   # trained judges, on the first competition day
# deployments_per_two_acts = 4   # Einsätze per started two Küren
# missing_deployment_fee = 7     # € per missing Einsatz
# registration_end = 2027-04-30T23:59:59+02:00  # default: registration_end

# Optional: features that are still being refined, on (true) or off (false).
# Unset ones follow the build default: jury registration is on in debug builds
# and off in release builds, moderation input is on.
[competition.features]
# Clubs register judges, admins plan the jury.
# jury_registration = true
# Clubs can add an extra text for moderation when they register acts.
# moderation_input = true

# Optional: the photos of the info board, the newest after each act and random
# recent ones in breaks; the music control previews the newest. The folder and
# its direct subfolders count. One of:
# - a folder in a Nextcloud account over WebDAV, with the user and an app
#   password: https://cloud.example.org/remote.php/dav/files/anna/Fotos
# - a Nextcloud share link (a password only if the share has one):
#   https://cloud.example.org/s/AbC123
# - a local folder, e.g. one the Nextcloud desktop client keeps in sync.
# [competition.photos]
# source = "https://cloud.example.org/remote.php/dav/files/anna/Fotos"
# user = "anna"
# password = "…"

# Categories in timeplan order.
#
# A category is defined by its age class on the determining day: min_age
# (e.g. 70 for "70+") and under_age (e.g. 15 for "U15"), or both ("U13" =
# min_age 11, under_age 13); a missing age means open-ended. Fractions are
# months: 9.5 = 9 years 6 months. A birthday on the determining day stays in
# the younger category. The birthday bounds are derived from the determining
# day, so changing it moves every category. Older files with from_birthday /
# to_birthday import if each date is whole months before the determining day.
# act_type is "single", "pair", "group_small" (Kleingruppe, 3 to 8 riders) or
# "group_large" (Großgruppe, more than 8 riders). single_male = true marks the
# male single categories; the other single categories are for female riders.
# A group's age is that of its oldest rider, replacement riders included.

