# Timeplan in order. An entry runs a category (its duration comes from the
# category and its acts), a final (from the final and its slots), or is a
# custom entry with a label and duration. earliest_start is optional. While a
# custom entry runs, the info board shows its label, the clock and photos;
# show_photos = false leaves out the photos. internal = true makes a custom
# entry an internal timeplan entry: only the organizer team sees it, public
# screens show a break. kind = "acts" makes an entry a start block with a
# label, e.g. "Nachstarter" (with or without a category or final);
# einfahrzeit_minutes overrides a start block's Einfahrzeit. Example times:
# replace them with the real ones.

