einfahrzeit_minutes = 10
act_duration_minutes = 3
judge_duration_minutes = 2
slots = [{ heat = "E P 1", count = 4 }, { heat = "E P 2", count = 4 }]

# Timeplan in order. An entry runs a category (its duration comes from the
