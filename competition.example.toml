# Heats (Vorlaufklassen): the categories of one discipline whose acts are
# ranked together in their preliminary round (Vorlauf); their best fill a
# final's slots. A heat's categories share one act type and, for singles,
# gender; a category is in at most one heat, group categories in none (they
# are their own final). A heat fills the slots of at most one final. Clubs
# never pick a heat: it follows from the category.
#
# threshold: the fewest acts a heat needs for its Vorlauf (Konzept §1.5).
#   Without: 6 if all its categories are U15 or younger (Junior Expert),
#   otherwise 5. With fewer acts the admin UI suggests skipping the Vorlauf.
# skip = true: the Vorlauf is skipped; the heat's acts start directly in its
#   final, and its categories' blocks stay in the timeplan, marked
#   "Vorlauf entfällt".

[[heats]]
name = "JE EM"
description = "Junior Expert Einzel Männlich (U11–U15)"
categories = ["EMU11", "EMU13", "EMU15"]
threshold = 6

[[heats]]
name = "E EM 1"
description = "Expert 1 Einzel Männlich (U17–U21)"
categories = ["EMU17", "EMU19", "EMU21"]

[[heats]]
name = "E EM 2"
description = "Expert 2 Einzel Männlich (U23 und älter)"
categories = ["EMU23", "EMU25", "EMU30", "EMU50", "EMU70", "EM70+"]

[[heats]]
name = "JE EW"
description = "Junior Expert Einzel Weiblich (U11–U15)"
categories = ["EWU11", "EWU13", "EWU15"]

[[heats]]
name = "E EW 1"
description = "Expert 1 Einzel Weiblich (U17–U21)"
categories = ["EWU17", "EWU19", "EWU21"]

[[heats]]
name = "E EW 2"
description = "Expert 2 Einzel Weiblich (U23 und älter)"
categories = ["EWU23", "EWU25", "EWU30", "EWU50", "EWU70", "EW70+"]

[[heats]]
name = "JE P"
description = "Junior Expert Paar (U11–U15)"
categories = ["PU11", "PU13", "PU15"]

[[heats]]
name = "E P 1"
description = "Expert 1 Paar (U17–U21)"
categories = ["PU17", "PU19", "PU21"]

[[heats]]
name = "E P 2"
description = "Expert 2 Paar (U23 und älter)"
categories = ["PU23", "PU25", "PU30", "PU50", "PU70", "P70+"]

# Finals: reserved slots for the best riders of the heats, planned before the
# results are known. Each slot runs like an act with the final's durations;
# slots lists them in start order as groups filled from a heat, e.g. 5 slots
# from the heat "JE EM" become "1. Finalist (JE EM)" … "5. Finalist (JE EM)".
# A [[timeplan]] entry with final = "<name>" plans a final (each final once).
# act_type and single_male name the discipline, which every heat of the final
# shares; only singles and pairs have finals. The final's categories are
# those of its heats: once the heats are judged, admins place their acts in
# the slots; the placement shows in the timeplan once it is published.

[[finals]]
name = "Finale 1 EM"
description = "Finale 1 Einzel Männlich (U11–U15)"
act_type = "single"
single_male = true
einfahrzeit_minutes = 10
act_duration_minutes = 3
judge_duration_minutes = 4
slots = [{ heat = "JE EM", count = 5 }]

[[finals]]
name = "Finale 2 EM"
description = "Finale 2 Einzel Männlich (U17 und älter)"
act_type = "single"
single_male = true
einfahrzeit_minutes = 10
act_duration_minutes = 3
judge_duration_minutes = 6
slots = [{ heat = "E EM 1", count = 4 }, { heat = "E EM 2", count = 4 }]

[[finals]]
name = "Finale 1 EW"
description = "Finale 1 Einzel Weiblich (U11–U15)"
act_type = "single"
single_male = false
einfahrzeit_minutes = 10
act_duration_minutes = 3
judge_duration_minutes = 4
slots = [{ heat = "JE EW", count = 5 }]

[[finals]]
name = "Finale 2 EW"
description = "Finale 2 Einzel Weiblich (U17 und älter)"
act_type = "single"
single_male = false
einfahrzeit_minutes = 10
act_duration_minutes = 3
judge_duration_minutes = 6
slots = [{ heat = "E EW 1", count = 4 }, { heat = "E EW 2", count = 4 }]

[[finals]]
name = "Finale 1 P"
description = "Finale 1 Paar (U11–U15)"
act_type = "pair"
einfahrzeit_minutes = 10
act_duration_minutes = 3
judge_duration_minutes = 2
slots = [{ heat = "JE P", count = 5 }]

[[finals]]
name = "Finale 2 P"
description = "Finale 2 Paar (U17 und älter)"
