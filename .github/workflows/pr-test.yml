name: PR Test

# Also called by the 2027 deploy pipeline, whose deploy waits for it.
on:
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  test-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    # GitHub scopes caches by branch: a PR also reads those of its base branch.
    - name: Cache cargo registry + target
      uses: Swatinem/rust-cache@v2

    # Prebuilt, instead of compiling it on every cold cache.
    - name: Install sqlx-cli
      uses: taiki-e/install-action@v2
      with:
        tool: sqlx-cli

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Create dummy .env file
      run: |
        cat > .env << 'EOF'
        BASE_URL=http://localhost:3000
        DATABASE_URL=sqlite://./db.sqlite?mode=rwc
        ADMIN='{ "name": "CI Admin", "password": "dummy_password", "email": "ci@example.com"}'
        SMTP_USER=noreply@example.com
        SMTP_PASSWORD="dummy_smtp_password"
        SMTP_SERVER=smtp.example.com
        JWT_SECRET=dummy_jwt_secret_for_ci_build_only
        HTTP_ADDRESS=0.0.0.0:3000
        EOF

    - name: Test build
      run: make all

    - name: Run tests
      run: make test

    - name: Run linting
      run: make lint
