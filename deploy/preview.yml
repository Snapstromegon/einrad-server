# Installs or updates the central 2027 instance (the inventory group is called
# preview) on einrad-server and points https://einrad-server.home.hoeser.dev/
# on the caddy VM at it, with the site file /etc/caddy/sites/einrad-server.caddy.
# deploy-2027.yml runs it on every push to 2027.
#
#   make deploy-preview   # or: ansible-playbook -i deploy/inventory.yml deploy/preview.yml
#
# It keeps the database and config.toml on the VM, and stops before changing
# anything if config.toml (or a local config.preview.toml to upload) is
# missing, or if it still has competition sections. Without a database, the
# server creates an empty one.
# -e preview_seed_demo=true backs up the database and recreates it with the
# demo data.
#
# Settings and their defaults: group_vars/all.yml and group_vars/preview.yml.
- name: Deploy the preview
  hosts: preview
  tasks:
    # Another user would install a second instance in its own home directory.
    - name: Check the user
      ansible.builtin.assert:
        that: ansible_facts.user_id == preview_user
        fail_msg: >-
          Log in to {{ inventory_hostname }} as {{ preview_user }} (-u {{ preview_user }}
          or User in ~/.ssh/config), not {{ ansible_facts.user_id }}; see bootstrap.yml.
        quiet: true

    # The instance keeps its config (with real SMTP) on the VM. Without it the
    # new service would replace the running one and not start: stop before
    # anything changes. See "The central 2027 instance" in the README for the
    # one-time move. A missing database is fine: the server creates it
    # (DATABASE_URL in cup_service_env).
    - name: Check the config on the server
      vars:
        app_dir: "{{ ansible_facts.user_dir }}/{{ cup_dir }}"
        local_config: "{{ [playbook_dir | dirname, cup_config_src] | path_join }}"
      block:
        - name: Look for config.toml
          ansible.builtin.stat:
            path: "{{ app_dir }}/config.toml"
            get_checksum: false
          register: server_config

        - name: Check config.toml
          ansible.builtin.assert:
            that: server_config.stat.exists or (cup_config_src | length > 0 and local_config is file)
            fail_msg: >-
              There's no config.toml in {{ app_dir }} on {{ inventory_hostname }} (and no
              {{ cup_config_src }} to upload): put the instance's config there first.
            quiet: true

        # The server refuses a config with them (they belong in
        # competition.toml now). Only the section headers are counted, no
        # values are printed.
        - name: Look for competition sections in config.toml
          ansible.builtin.command:
            argv:
              - grep
              - -cE
              - ^[[:space:]]*\[\[?[[:space:]]*(competition|categories|finals|timeplan|jury_categories|photos)[[:space:]]*[].]
              - "{{ app_dir }}/config.toml"
          register: competition_sections
          changed_when: false
          failed_when: competition_sections.rc > 1
          check_mode: false
          when: server_config.stat.exists and not (cup_config_src | length > 0 and local_config is file)

        - name: Check for competition sections
          ansible.builtin.assert:
            that: competition_sections.stdout | default('0') | int == 0
            fail_msg: >-
              {{ app_dir }}/config.toml on {{ inventory_hostname }} still has competition sections
              ([competition…], [[categories]], [[finals]], [[timeplan]], [[jury_categories]] or
              [photos]): move them into competition.toml next to it ([photos] as
              [competition.photos]).
            quiet: true

    - name: Find the binary
      ansible.builtin.import_tasks: tasks/binary.yml

    - name: Install ffmpeg and curl
      become: true
      ansible.builtin.apt:
        name: [ffmpeg, curl]
        update_cache: true
        cache_valid_time: 3600

    # The old demo playbook's service had the same name: installing the
    # release stops it and replaces its unit. Its checkout in
    # ~/nrw-freestyle-cup-registration stays.
    - name: Install the release
      ansible.builtin.import_tasks: tasks/release.yml

    - name: Recreate the demo data
      when: preview_seed_demo | bool
      block:
        - name: Upload seed_demo and demo-data.toml
          ansible.builtin.copy:
            src: "{{ item.src }}"
            dest: "{{ app_dir }}/{{ item.dest }}"
            mode: "{{ item.mode }}"
          loop:
            - { src: "{{ cup_seed_demo_path }}", dest: bin/seed_demo, mode: "0755" }
            - { src: "{{ playbook_dir | dirname }}/demo-data.toml", dest: demo-data.toml, mode: "0644" }
          loop_control:
            label: "{{ item.dest }}"

        - name: Stop the service
          become: true
          ansible.builtin.systemd_service:
            name: "{{ cup_service }}"
            state: stopped

        # seed_demo deletes the database.
        - name: Back up the database
          ansible.builtin.import_tasks: tasks/backup.yml

        # The same database as the service, whatever config.toml says.
        - name: Run seed_demo
          ansible.builtin.command: bin/seed_demo
          args:
            chdir: "{{ app_dir }}"
          environment:
            DATABASE_URL: "{{ cup_service_env.DATABASE_URL }}"
          changed_when: true

        - name: Start the service
          become: true
          ansible.builtin.systemd_service:
            name: "{{ cup_service }}"
            state: started

- name: Point the preview domain at the preview
  hosts: proxy
  become: true
  vars:
    preview_host: "{{ groups['preview'] | first }}"
    domain: "{{ hostvars[preview_host].cup_domain }}"
  tasks:
    - name: Set up the site files
      ansible.builtin.import_tasks: tasks/caddy_setup.yml

    # The domain moved to its site file; Caddy rejects it twice, so these go
    # first.
    - name: Remove the old managed block of {{ domain }}
      ansible.builtin.blockinfile:
        path: "{{ caddy_dir }}/Caddyfile"
        marker: "# {mark} ANSIBLE MANAGED: {{ domain }}"
        state: absent
        validate: caddy validate --adapter caddyfile --config %s
      notify: Reload Caddy

    # A site block for the domain in the Caddyfile, e.g. the hand-written one
    # from before.
    - name: Remove other entries of {{ domain }}
      ansible.builtin.replace:
        path: "{{ caddy_dir }}/Caddyfile"
        regexp: ^{{ domain | regex_escape }} \{\n[^{}]*\}\n
        validate: caddy validate --adapter caddyfile --config %s
      notify: Reload Caddy

    - name: Add {{ domain }}
      ansible.builtin.include_tasks: tasks/caddy_site.yml
      vars:
        caddy_site: "{{ hostvars[preview_host].cup_service }}"
        caddy_site_content: |
          {{ domain }} {
          	reverse_proxy "http://{{ preview_host }}:{{ hostvars[preview_host].cup_port }}"
          }

  handlers:
    - name: Reload Caddy
      ansible.builtin.command: "{{ caddy_reload_command }}"
      changed_when: true
