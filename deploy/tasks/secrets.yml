# Generates secrets.env (JWT_SECRET, RELOAD_DB_TOKEN) in cup_dir once on the
# server and never overwrites it, so logins survive a deploy. The service loads
# it as an EnvironmentFile. The values never pass through Ansible. Imported by
# preview.yml and preview-pr.yml, before tasks/release.yml.
- name: Create cup_dir for secrets.env
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/{{ cup_dir }}"
    state: directory
    mode: "0750"

- name: Generate secrets.env
  ansible.builtin.shell:
    cmd: |
      set -eu
      umask 077
      # Assigned first, so a failing openssl stops the script instead of
      # writing empty secrets that creates: would then keep forever.
      jwt=$(openssl rand -hex 32)
      reload=$(openssl rand -hex 32)
      printf 'JWT_SECRET=%s\nRELOAD_DB_TOKEN=%s\n' "$jwt" "$reload" > secrets.env.new
      mv secrets.env.new secrets.env
    chdir: "{{ ansible_facts.user_dir }}/{{ cup_dir }}"
    creates: secrets.env
  register: secrets_env
