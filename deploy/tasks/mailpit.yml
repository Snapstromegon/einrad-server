# Runs Mailpit in Docker (needs Docker and community.docker): the image of
# the FROM line in deploy/mailpit/Dockerfile, SMTP on
# 127.0.0.1:<mailpit_smtp_port>, the UI and API on <mailpit_ui_port> of every
# interface, the mails in the volume `mailpit`. A new tag replaces the
# container and keeps the mails. The playbook must be in deploy/, next to
# mailpit/.
- name: Read Mailpit's image
  ansible.builtin.set_fact:
    mailpit_image: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/mailpit/Dockerfile')
         | regex_search('(?m)^FROM\s+(\S+)', '\1') | first }}

- name: Run Mailpit
  community.docker.docker_container:
    name: mailpit
    image: "{{ mailpit_image }}"
    restart_policy: unless-stopped
    published_ports:
      - 127.0.0.1:{{ mailpit_smtp_port }}:1025
      - "{{ mailpit_ui_port }}:8025"
    volumes:
      - mailpit:/data
    env:
      MP_DATABASE: /data/mailpit.db
      # The oldest mails go first.
      MP_MAX_MESSAGES: "{{ mailpit_max_messages | string }}"

- name: Wait for Mailpit
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ mailpit_ui_port }}/readyz
  register: mailpit_ready
  until: mailpit_ready.status == 200
  retries: 30
  delay: 2
