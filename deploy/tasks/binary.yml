# Finds the server binary on this machine (cup_binary or the GitHub release)
# and sets cup_binary_path and cup_binary_checksum. With preview_seed_demo it
# also finds seed_demo (next to cup_binary or the release's
# cup_github_seed_demo_asset) and sets cup_seed_demo_path.
- name: Use the given binary or the GitHub release
  delegate_to: localhost
  run_once: true
  vars:
    repo_root: "{{ playbook_dir | dirname }}"
    download_dir: "{{ repo_root }}/target/deploy"
    download: "{{ cup_binary is not defined }}"
    with_seed_demo: "{{ preview_seed_demo | default(false) | bool }}"
  block:
    # Nothing builds here: the binaries come from GitHub Actions.
    - name: Check cup_binary_source
      ansible.builtin.assert:
        that: cup_binary_source == 'github'
        fail_msg: cup_binary_source must be github; use -e cup_binary=<file> for a local binary.
        quiet: true

    - name: Create the download directory
      ansible.builtin.file:
        path: "{{ download_dir }}"
        state: directory
        mode: "0755"
      when: download

    - name: Download the assets of {{ cup_github_tag }}
      ansible.builtin.get_url:
        url: https://github.com/{{ cup_github_repo }}/releases/download/{{ cup_github_tag }}/{{ item }}
        dest: "{{ download_dir }}/{{ cup_github_tag }}-{{ item }}"
        mode: "0755"
        # The tag moves with every build of main.
        force: true
      loop: "{{ [cup_github_asset] + ([cup_github_seed_demo_asset] if with_seed_demo else []) }}"
      when: download

    - name: Pick the binaries
      ansible.builtin.set_fact:
        # cup_binary is relative to the repository.
        cup_binary_path: >-
          {{ [repo_root, cup_binary] | path_join if cup_binary is defined
             else download_dir ~ '/' ~ cup_github_tag ~ '-' ~ cup_github_asset }}
        cup_seed_demo_path: >-
          {{ ([repo_root, cup_binary] | path_join | dirname) ~ '/seed_demo' if cup_binary is defined
             else download_dir ~ '/' ~ cup_github_tag ~ '-' ~ cup_github_seed_demo_asset }}

    - name: Read the binary's checksum
      ansible.builtin.stat:
        path: "{{ cup_binary_path }}"
        checksum_algorithm: sha256
      register: local_binary
      failed_when: not local_binary.stat.exists

    - name: Look for seed_demo
      ansible.builtin.stat:
        path: "{{ cup_seed_demo_path }}"
        get_checksum: false
      register: local_seed_demo
      failed_when: not local_seed_demo.stat.exists
      when: with_seed_demo

    - name: Remember the checksum
      ansible.builtin.set_fact:
        cup_binary_checksum: "{{ local_binary.stat.checksum }}"
