# Host names are SSH host aliases: user, host name and key come from
# ~/.ssh/config, nothing about the login is set here.
all:
  children:
    preview:
      hosts:
        einrad-server:
    production:
      hosts:
        uberspace:
          # Uberspace 7 runs CentOS 7, whose python3 is too old for Ansible.
          ansible_python_interpreter: /usr/bin/python3.11
    # The reverse proxy in front of the preview.
    proxy:
      hosts:
        caddy:
    # GitHub Actions reaches einrad-server and caddy through it (ProxyJump).
    # Only bootstrap.yml uses it: define the alias `jump` in ~/.ssh/config.
    jumphost:
      hosts:
        jump:
