cup_environment: preview
cup_service_manager: systemd
cup_domain: einrad-server.home.hoeser.dev
# The user the playbook logs in as and the services run as (bootstrap.yml
# creates it); their home directory holds cup_dir.
preview_user: deploy

cup_service_env:
  HTTP_ADDRESS: 0.0.0.0:{{ cup_port }}
  BASE_URL: https://{{ cup_domain }}/

# Recreate the database with the demo data (seed_demo) after the deploy.
# seed_demo is the file next to cup_binary or the release's
# cup_github_seed_demo_asset.
preview_seed_demo: false
