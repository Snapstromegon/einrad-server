cup_environment: preview
cup_service_manager: systemd
cup_domain: einrad-server.home.hoeser.dev
# The user the playbook logs in as and the services run as (bootstrap.yml
# creates it); their home directory holds cup_dir.
preview_user: deploy

cup_service_env:
  HTTP_ADDRESS: 0.0.0.0:{{ cup_port }}
  DATABASE_URL: sqlite://./{{ cup_database }}?mode=rwc
  BASE_URL: https://{{ cup_domain }}/

# Recreate the database with the demo data (seed_demo) after the deploy.
# seed_demo is the file next to cup_binary or the release's
# cup_github_seed_demo_asset.
preview_seed_demo: false

# Mailpit (mailpit.yml) catches the mails of the PR previews; the instance of
# preview.yml sends real mail and doesn't use it. SMTP listens on 127.0.0.1
# only, the UI on the LAN for caddy, which serves it at mailpit_domain behind
# Authelia.
mailpit_domain: mail.einrad-server.home.hoeser.dev
mailpit_smtp_port: 1025
mailpit_ui_port: 8025
mailpit_max_messages: 5000

# PR previews (preview-pr.yml -e pr=<n>): the instance pr-<n> of the systemd
# template unit einrad-server@.service, in ~/<preview_pr_dir>/pr-<n>, on port
# preview_pr_port_base + n, at https://pr-<n>.<cup_domain>/. Every deploy
# recreates the database with seed_demo; the songs are downloaded once into
# preview_demo_songs, which all previews share.
preview_pr_dir: previews
preview_pr_port_base: 20000
preview_demo_songs: /var/cache/einrad-server/demo-songs
