[package]
name = "db-core"
version = "0.1.0"
edition = "2024"

[features]
# Backend-agnostic tests over `&dyn Db`, see `conformance`.
conformance = []

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sqlx = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }

[dev-dependencies]
# Unit tests of the conformance module (its guard) need the feature, which
# a plain `cargo test -p db-core` does not enable.
db-core = { path = ".", features = ["conformance"] }
serde_json = "1"
